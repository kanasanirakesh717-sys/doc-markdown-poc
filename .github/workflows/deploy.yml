steps:
   - name: Checkout code
     uses: actions/checkout@v4

   - name: Configure AWS credentials
     uses: aws-actions/configure-aws-credentials@v4
     with:
       aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
       aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
       aws-region: ${{ secrets.AWS_REGION || env.AWS_REGION }}

   - name: Login to Amazon ECR
     id: login-ecr
     uses: aws-actions/amazon-ecr-login@v2

   - name: Set up Docker Buildx
     uses: docker/setup-buildx-action@v3

   - name: Build and push Docker image
     env:
       ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
     run: |
       docker buildx build \
         --platform linux/amd64 \
         --provenance=false \
         --sbom=false \
         -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
         --push \
         ./backend

   - name: Update Lambda if function already exists
     env:
       ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
     run: |
       if aws lambda get-function --function-name "$LAMBDA_FUNCTION_NAME" --region "$AWS_REGION" >/dev/null 2>&1; then
         aws lambda update-function-code \
           --function-name "$LAMBDA_FUNCTION_NAME" \
           --image-uri "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
           --region "$AWS_REGION"
       else
         echo "Lambda function not created yet; create it in Console using the pushed ECR image."
       fi